<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ESP32 RC Dashboard</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial;
        }

        .header {
            background: #1e1e1e;
            padding: 12px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            text-align: center;
            padding: 15px;
        }

        .status {
            margin: 10px;
            color: #aaa;
        }

        /* ===== VIDEO FIX CHÍNH ===== */
        #videoView {
            width: 95%;
            max-width: 900px;

            aspect-ratio: 16 / 9;   /* FIX KHÔNG MẤT KHUNG */

            background: black;
            border-radius: 10px;
            border: 2px solid #333;

            display: block;
            margin: 0 auto;
            object-fit: cover;
        }

        /* CONTROLS */
        .controls {
            margin-top: 15px;
        }

        .controls button {
            margin: 5px;
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        .controls button.active {
            background: #00aa55;
        }

        .stats {
            margin-top: 10px;
            color: #00ff88;
        }
    </style>
</head>

<body>

<div class="header">🚗 ESP32 RC + Camera Dashboard</div>

<div class="container">

    <div class="status" id="status">Connecting...</div>

    <div id="videoContainer"></div>

    <!-- CONTROL -->
    <div class="controls">

        <button id="headlightBtn" onclick="toggleHeadlight()">
            🔆 Bật đèn
        </button>

        <button id="blinkBtn">⚡ NHÁY HOLD</button>

        <br/>

        <button onclick="selectStream('1')">📷 Cam 1</button>
        <button onclick="selectStream('2')">📷 Cam 2</button>

    </div>

    <div class="stats">
        FPS: <span id="fps">0</span> |
        Frames: <span id="frames">0</span>
    </div>

</div>

<script>

    const DEVICE_ID = "ESP32CAR_001";
    let STREAM_ID = "1";

    let socket = null;
    let frameCount = 0;
    let fps = 0;
    let headlightOn = false;
    /* ================= VIDEO INIT ================= */
    const videoContainer = document.getElementById("videoContainer");
    const statusEl = document.getElementById("status");
    const fpsEl = document.getElementById("fps");
    const framesEl = document.getElementById("frames");

    let videoTarget = document.createElement("img");
    videoTarget.id = "videoView";
    videoContainer.appendChild(videoTarget);

    let lastUrl = null;

    /* ================= WS CONNECT ================= */
    function connectWS() {

        const wsUrl = `ws://${location.host || "192.168.1.5"}/video`;

        socket = new WebSocket(wsUrl);
        socket.binaryType = "arraybuffer";

        socket.onopen = () => {
            statusEl.innerHTML = "🟢 Connected";

            send({
                type: "STREAM_SELECT",
                streamId: STREAM_ID,
                deviceId: null,
                cmd: null,
                data: null
            });
        };

        socket.onmessage = (event) => {

            if (typeof event.data === "string") return;

            frameCount++;
            framesEl.innerText = frameCount;

            const blob = new Blob([event.data], { type: "image/jpeg" });
            const url = URL.createObjectURL(blob);

            videoTarget.src = url;

            // FIX MEMORY + LAYOUT STABLE
            if (lastUrl) {
                URL.revokeObjectURL(lastUrl);
            }
            lastUrl = url;
        };

        socket.onclose = () => {
            statusEl.innerHTML = "🔴 Reconnecting...";
            setTimeout(connectWS, 2000);
        };

        socket.onerror = () => {
            statusEl.innerHTML = "⚠️ Error";
        };
    }

    /* ================= SEND ================= */
    function send(obj) {
        if (!socket || socket.readyState !== 1) return;
        socket.send(JSON.stringify(obj));
    }

    /* ================= STREAM ================= */
    function selectStream(id) {
        STREAM_ID = id;

        send({
            type: "STREAM_SELECT",
            streamId: STREAM_ID,
            deviceId: null,
            cmd: null,
            data: null
        });
    }

    /* ================= CAR CONTROL ================= */
    function sendCar(cmd) {

        send({
            type: "CAR_CONTROL",
            streamId: STREAM_ID,
            deviceId: DEVICE_ID,
            cmd: cmd,
            data: null
        });
    }

    /* ================= HOLD BLINK (FIXED) ================= */
    const blinkBtn = document.getElementById("blinkBtn");
    let blinking = false;

    function startBlink() {
        if (blinking) return;
        blinking = true;

        blinkBtn.classList.add("active");
        sendCar("BLINK_ON");
    }

    function stopBlink() {
        if (!blinking) return;
        blinking = false;

        blinkBtn.classList.remove("active");
        sendCar("BLINK_OFF");
    }

    /* POINTER EVENTS (BEST PRACTICE) */
    blinkBtn.addEventListener("pointerdown", startBlink);
    blinkBtn.addEventListener("pointerup", stopBlink);
    blinkBtn.addEventListener("pointercancel", stopBlink);
    blinkBtn.addEventListener("pointerleave", stopBlink);

    /* ================= FPS ================= */
    setInterval(() => {
        fpsEl.innerText = fps;
        fps = frameCount;
        frameCount = 0;
    }, 1000);

    /* ================= START ================= */
    connectWS();
    function toggleHeadlight() {

        headlightOn = !headlightOn;

        if (headlightOn) {
            sendCar("HEADLIGHT_ON");
            updateHeadlightUI(true);
        } else {
            sendCar("HEADLIGHT_OFF");
            updateHeadlightUI(false);
        }
    }
    function updateHeadlightUI(state) {

        const btn = document.getElementById("headlightBtn");

        if (state) {
            btn.innerText = "💡 Tắt đèn";
            btn.style.background = "#ffb300";
        } else {
            btn.innerText = "🔆 Bật đèn";
            btn.style.background = "#333";
        }
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Camera Viewer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .header {
            background: #1e1e1e;
            padding: 15px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
            text-align: center;
        }

        .status {
            margin-bottom: 15px;
            font-size: 16px;
        }

        .info {
            margin-bottom: 15px;
            color: #aaa;
        }

        #video {
            width: 90%;
            max-width: 1000px;
            border-radius: 10px;
            border: 2px solid #333;
            background: black;
        }

        .stats {
            margin-top: 15px;
            color: #00ff88;
        }
    </style>
</head>

<body>

<div class="header">
    🎥 ESP32 Camera Stream
</div>

<div class="container">

    <div class="status" id="status">
        Connecting...
    </div>

    <div class="info">
        Stream ID: <b>1</b>
    </div>

    <img id="video">

    <div class="stats">
        FPS: <span id="fps">0</span>
        |
        Frames: <span id="frames">0</span>
    </div>

</div>

<script>

    const STREAM_ID = "1";

    const video = document.getElementById("video");
    const statusEl = document.getElementById("status");
    const fpsEl = document.getElementById("fps");
    const framesEl = document.getElementById("frames");

    let socket = null;

    let frameCount = 0;
    let fps = 0;

    function connectWebSocket() {

        const protocol =
            location.protocol === "https:"
                ? "wss"
                : "ws";

        const wsUrl =
            `${protocol}://${location.host}/video`;

        console.log("CONNECT:", wsUrl);

        socket = new WebSocket(wsUrl);

        socket.binaryType = "arraybuffer";

        socket.onopen = () => {

            console.log("WS OPEN");

            statusEl.innerHTML =
                "🟢 Connected";

            socket.send(STREAM_ID);
        };

        socket.onmessage = (event) => {

            if (typeof event.data === "string") {

                console.log("TEXT:", event.data);
                return;
            }

            frameCount++;

            framesEl.innerText = frameCount;

            const blob = new Blob(
                [event.data],
                {
                    type: "image/jpeg"
                }
            );

            const imageUrl =
                URL.createObjectURL(blob);

            video.onload = () => {
                URL.revokeObjectURL(imageUrl);
            };

            video.src = imageUrl;
        };

        socket.onclose = () => {

            console.log("WS CLOSED");

            statusEl.innerHTML =
                "🔴 Disconnected - Reconnecting...";

            setTimeout(
                connectWebSocket,
                3000
            );
        };

        socket.onerror = (err) => {

            console.error(err);

            statusEl.innerHTML =
                "⚠️ Error";
        };
    }

    setInterval(() => {

        fpsEl.innerText = fps;

        fps = frameCount;
        frameCount = 0;

    }, 1000);

    connectWebSocket();

</script>

</body>

</html>

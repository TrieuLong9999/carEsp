<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <title>ESP32 Camera Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #0f0f0f;
            color: white;
            margin: 0;
            padding: 0;
        }

        .header {
            padding: 15px;
            background: #1c1c1c;
            font-size: 18px;
        }

        .container {
            display: flex;
            height: calc(100vh - 50px);
        }

        /* LEFT */
        .sidebar {
            width: 280px;
            background: #151515;
            padding: 10px;
            overflow-y: auto;
        }

        .camera-item {
            padding: 10px;
            margin: 8px 0;
            background: #222;
            cursor: pointer;
            border-radius: 6px;
        }

        .camera-item:hover {
            background: #333;
        }

        .camera-item.active {
            background: #0d6efd;
        }

        /* RIGHT */
        .main {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #video {
            width: 80%;
            max-width: 900px;
            border-radius: 10px;
            border: 2px solid #333;
            margin-top: 10px;
        }

        .info {
            margin-top: 10px;
            color: #aaa;
        }

        .title {
            font-size: 20px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="header">
    🎥 ESP32 Camera Dashboard
</div>

<div class="container">

    <!-- LEFT SIDEBAR -->
    <div class="sidebar">
        <h3>Danh sách camera</h3>
        <div id="cameraList"></div>
    </div>

    <!-- MAIN -->
    <div class="main">

        <div class="title" id="cameraTitle">
            Chọn camera để xem
        </div>

        <div class="info" id="status">
            Disconnected
        </div>

        <img id="video" />

    </div>

</div>

<script>

    let socket = null;
    let currentCameraId = null;

    const cameraListEl = document.getElementById("cameraList");
    const video = document.getElementById("video");
    const statusEl = document.getElementById("status");
    const titleEl = document.getElementById("cameraTitle");

    // =========================
    // LOAD CAMERA LIST
    // =========================
    async function loadCameras() {

        const res = await fetch("/api/cameras");
        const cameras = await res.json();

        cameraListEl.innerHTML = "";

        cameras.forEach(cam => {

            const div = document.createElement("div");
            div.className = "camera-item";
            div.innerText = `Camera ${cam.cameraId} - ${cam.ip}`;

            div.onclick = () => selectCamera(cam.cameraId, div);

            cameraListEl.appendChild(div);
        });
    }

    // =========================
    // SELECT CAMERA
    // =========================
    function selectCamera(cameraId, element) {

        currentCameraId = cameraId;

        titleEl.innerText = "Camera " + cameraId;

        document.querySelectorAll(".camera-item")
            .forEach(e => e.classList.remove("active"));

        element.classList.add("active");

        connectWebSocket(cameraId);
    }

    // =========================
    // CONNECT WS
    // =========================
    function connectWebSocket(cameraId) {

        if (socket) {
            socket.close();
        }

        socket = new WebSocket("ws://localhost:8080/video");

        socket.binaryType = "arraybuffer";

        socket.onopen = () => {

            statusEl.innerText = "Connected camera " + cameraId;

            socket.send(cameraId.toString());
        };

        socket.onmessage = (event) => {

            const blob = new Blob(
                [event.data],
                { type: "image/jpeg" }
            );

            const url = URL.createObjectURL(blob);

            video.src = url;
        };

        socket.onclose = () => {
            statusEl.innerText = "Disconnected";
        };
    }

    // init
    loadCameras();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ESP32 RC MOBA UI</title>

    <style>
        body {
            margin: 0;
            background: #0f0f0f;
            color: white;
            font-family: Arial;
            overflow: hidden;
        }

        /* ===== TOP STATUS ===== */
        .top {
            height: 40px;
            background: #1e1e1e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* ===== VIDEO CENTER ===== */
        .video-area {
            height: calc(100vh - 200px);
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
        }

        #videoView {
            width: 95%;
            height: 95%;
            border-radius: 12px;
            border: 2px solid #333;
            object-fit: cover;
        }

        /* ===== BOTTOM AREA ===== */
        .bottom {
            height: 160px;
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #151515;
        }

        /* ===== LEFT CONTROL (FORWARD / BACKWARD) ===== */
        .left-control {
            width: 45%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .big-btn {
            width: 90px;
            height: 60px;
            border-radius: 12px;
            border: none;
            background: #333;
            color: white;
            font-size: 18px;
        }

        .big-btn:active {
            background: #00aa55;
        }

        /* ===== RIGHT CONTROL (LEFT/RIGHT + LIGHT) ===== */
        .right-control {
            width: 45%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .small-btn {
            width: 70px;
            height: 50px;
            border-radius: 10px;
            border: none;
            background: #333;
            color: white;
        }

        .small-btn:active {
            background: #00aa55;
        }

        .light-btn.active {
            background: orange;
        }

    </style>
</head>

<body>

<div class="top" id="status">🟢 CONNECTING...</div>

<!-- ================= VIDEO ================= -->
<div class="video-area">
    <img id="videoView" />
</div>

<!-- ================= BOTTOM CONTROLS ================= -->
<div class="bottom">

    <!-- LEFT: UP / DOWN -->
    <div class="left-control">

        <button class="big-btn"
                onpointerdown="sendCar('FWD')"
                onpointerup="sendCar('STOP')">
            ⬆
        </button>

        <button class="big-btn"
                onpointerdown="sendCar('BWD')"
                onpointerup="sendCar('STOP')">
            ⬇
        </button>

    </div>

    <!-- RIGHT: LEFT / RIGHT + LIGHT -->
    <div class="right-control">

        <div class="row">
            <button class="small-btn"
                    onpointerdown="sendCar('LEFT')"
                    onpointerup="sendCar('STOP')">
                ⬅
            </button>

            <button class="small-btn"
                    onpointerdown="sendCar('RIGHT')"
                    onpointerup="sendCar('STOP')">
                ➡
            </button>
        </div>

        <div class="row">
            <button id="lightBtn"
                    class="small-btn light-btn"
                    onclick="toggleLight()">
                💡
            </button>

            <button class="small-btn"
                    onpointerdown="sendCar('BLINK_ON')"
                    onpointerup="sendCar('BLINK_OFF')">
                ⚡
            </button>
        </div>

    </div>

</div>

<script>

    const DEVICE_ID = "ESP32CAM_001";
    let STREAM_ID = "1";

    let socket = null;
    let lightOn = false;

    /* ================= WS ================= */
    function connectWS() {

        socket = new WebSocket(`ws://${location.host || "192.168.1.5"}/video`);
        socket.binaryType = "arraybuffer";

        socket.onopen = () => {
            document.getElementById("status").innerText = "🟢 CONNECTED";

            send({
                type: "STREAM_SELECT",
                streamId: STREAM_ID,
                deviceId: DEVICE_ID,
                cmd: null,
                data: null
            });
        };

        socket.onmessage = (e) => {
            if (typeof e.data === "string") return;

            const blob = new Blob([e.data], {type:"image/jpeg"});
            document.getElementById("videoView").src =
                URL.createObjectURL(blob);
        };

        socket.onclose = () => {
            document.getElementById("status").innerText = "🔴 RECONNECT...";
            setTimeout(connectWS, 2000);
        };
    }

    /* ================= SEND ================= */
    function send(obj){
        if(socket?.readyState === 1){
            socket.send(JSON.stringify(obj));
        }
    }

    function sendCar(cmd){
        send({
            type:"CAR_CONTROL",
            streamId: STREAM_ID,
            deviceId: DEVICE_ID,
            cmd: cmd,
            data: null
        });
    }

    /* ================= LIGHT TOGGLE ================= */
    function toggleLight(){
        lightOn = !lightOn;

        sendCar(lightOn ? "HEADLIGHT_ON" : "HEADLIGHT_OFF");

        const btn = document.getElementById("lightBtn");
        btn.classList.toggle("active", lightOn);
    }

    /* ================= START ================= */
    connectWS();

</script>

</body>
</html>
